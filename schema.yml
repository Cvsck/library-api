openapi: 3.0.3
info:
  title: Library API
  version: 1.0.0
  description: API для управления библиотекой, авторизацией и пользователями.
paths:
  /api/catalog/authors/:
    get:
      operationId: api_catalog_authors_list
      description: Возвращает список всех авторов. Поддерживает поиск и сортировку
        по имени.
      summary: Список авторов
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuthorList'
          description: ''
    post:
      operationId: api_catalog_authors_create
      description: Создаёт нового автора. Требуется имя и дата рождения.
      summary: Создать нового автора
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Author'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Author'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Author'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
          description: ''
  /api/catalog/authors/{id}/:
    get:
      operationId: api_catalog_authors_retrieve
      description: Возвращает одного автора по его идентификатору.
      summary: Получить автора по ID
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Автор.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
          description: ''
    put:
      operationId: api_catalog_authors_update
      description: Полное обновление данных автора.
      summary: Обновить автора
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Автор.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Author'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Author'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Author'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
          description: ''
    patch:
      operationId: api_catalog_authors_partial_update
      description: Обновление отдельных полей автора.
      summary: Частичное обновление автора
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Автор.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAuthor'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAuthor'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAuthor'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
          description: ''
    delete:
      operationId: api_catalog_authors_destroy
      description: Удаляет автора по ID.
      summary: Удалить автора
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Автор.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/catalog/books/:
    get:
      operationId: api_catalog_books_list
      description: Получить все книги с авторами и жанрами. Поддерживает фильтрацию
        и поиск.
      summary: Список книг
      parameters:
      - in: query
        name: author
        schema:
          type: integer
      - in: query
        name: genres
        schema:
          type: array
          items:
            type: integer
        explode: true
        style: form
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookReadList'
          description: ''
    post:
      operationId: api_catalog_books_create
      description: Создание новой книги с указанием автора, жанров, даты публикации
        и ISBN.
      summary: Создать книгу
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookWrite'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookRead'
          description: ''
  /api/catalog/books/{id}/:
    get:
      operationId: api_catalog_books_retrieve
      description: Получить одну книгу по её ID.
      summary: Получить книгу
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Книга.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookRead'
          description: ''
    put:
      operationId: api_catalog_books_update
      description: Полное обновление книги по ID.
      summary: Обновить книгу
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Книга.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookWrite'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookRead'
          description: ''
    patch:
      operationId: api_catalog_books_partial_update
      description: Обновление отдельных полей книги.
      summary: Частично обновить книгу
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Книга.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBookWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBookWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBookWrite'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookRead'
          description: ''
    delete:
      operationId: api_catalog_books_destroy
      description: Удаление книги по ID.
      summary: Удалить книгу
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Книга.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/catalog/genres/:
    get:
      operationId: api_catalog_genres_list
      description: Возвращает список всех жанров. Поддерживает поиск и сортировку
        по названию.
      summary: Список жанров
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGenreList'
          description: ''
    post:
      operationId: api_catalog_genres_create
      description: Создаёт новый жанр. Требуется название.
      summary: Создать новый жанр
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Genre'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Genre'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Genre'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
          description: ''
  /api/catalog/genres/{id}/:
    get:
      operationId: api_catalog_genres_retrieve
      description: Возвращает один жанр по его идентификатору.
      summary: Получить жанр по ID
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Жанр.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
          description: ''
    put:
      operationId: api_catalog_genres_update
      description: Полное обновление названия жанра.
      summary: Обновить жанр
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Жанр.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Genre'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Genre'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Genre'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
          description: ''
    patch:
      operationId: api_catalog_genres_partial_update
      description: Обновление отдельных полей жанра.
      summary: Частичное обновление жанра
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Жанр.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGenre'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedGenre'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedGenre'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
          description: ''
    delete:
      operationId: api_catalog_genres_destroy
      description: Удаляет жанр по ID.
      summary: Удалить жанр
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Жанр.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/catalog/issue-books/:
    get:
      operationId: api_catalog_issue_books_list
      description: Возвращает все записи о выдаче книг. Доступно авторизованным пользователям.
      summary: Список всех выдач
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIssueBookList'
          description: ''
    post:
      operationId: api_catalog_issue_books_create
      description: Создаёт новую запись о выдаче книги. Доступно только администраторам.
      summary: Создать выдачу книги
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueBook'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IssueBook'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IssueBook'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueBook'
          description: ''
  /api/catalog/issue-books/{id}/:
    get:
      operationId: api_catalog_issue_books_retrieve
      description: Возвращает одну запись о выдаче книги по её идентификатору.
      summary: Получить выдачу по ID
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this issue book.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueBook'
          description: ''
    put:
      operationId: api_catalog_issue_books_update
      description: Полное обновление записи о выдаче. Только для администраторов.
      summary: Обновить выдачу
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this issue book.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueBook'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IssueBook'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IssueBook'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueBook'
          description: ''
    patch:
      operationId: api_catalog_issue_books_partial_update
      description: Обновление отдельных полей записи о выдаче. Только для администраторов.
      summary: Частично обновить выдачу
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this issue book.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedIssueBook'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedIssueBook'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedIssueBook'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueBook'
          description: ''
    delete:
      operationId: api_catalog_issue_books_destroy
      description: Удаляет запись о выдаче книги. Только для администраторов.
      summary: Удалить выдачу
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this issue book.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/catalog/my-issued-books/:
    get:
      operationId: api_catalog_my_issued_books_list
      description: Список книг, выданных текущему пользователю.
      summary: Мои выданные книги
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Выдачи пользователя
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMyIssueBookList'
          description: ''
  /api/catalog/register/:
    post:
      operationId: api_catalog_register_create
      description: Создаёт нового пользователя по email и паролю.
      summary: Регистрация пользователя
      tags:
      - Пользователь
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/catalog/token/:
    post:
      operationId: api_catalog_token_create
      description: Возвращает access и refresh токены по email и паролю.
      summary: Получение JWT токена
      tags:
      - Аутентификация
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenObtainPair'
          description: ''
  /api/schema/:
    get:
      operationId: api_schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
